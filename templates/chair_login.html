<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chair Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background: #090909;
            color: #f5f5f5;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }


        /* ================================================
           BACK
        ================================================ */

        .back {
            position: fixed;

            top: 28px;
            left: 30px;

            color: #777;

            text-decoration: none;

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 1.5px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back:hover {
            color: white;

            transform:
                translateX(-4px);
        }


        /* ================================================
           LOGIN BOX
        ================================================ */

        .login-wrapper {

            width:
                min(100%,
                    470px);
        }


        .eyebrow {

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 3px;

            color: #666;

            margin-bottom: 18px;
        }


        h1 {

            font-size:
                clamp(55px,
                    11vw,
                    90px);

            line-height:
                0.88;

            font-weight: 900;

            letter-spacing:
                -5px;

            margin-bottom: 28px;
        }


        .description {

            color: #777;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 42px;
        }


        /* ================================================
           ERROR
        ================================================ */

        .error {

            padding: 13px 15px;

            margin-bottom: 18px;

            border:
                1px solid #444;

            background:
                #111;

            color:
                #aaa;

            font-size: 10px;

            font-weight: 800;

            letter-spacing:
                0.8px;
        }


        /* ================================================
           FORM
        ================================================ */

        form {
            width: 100%;
        }


        label {

            display: block;

            margin-bottom: 9px;

            color: #777;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 2px;
        }


        input {

            width: 100%;

            padding:
                17px 16px;

            margin-bottom: 18px;

            border:
                1px solid #333;

            outline: none;

            background:
                #111;

            color:
                white;

            font-size:
                15px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }


        input:focus {

            border-color:
                #777;

            background:
                #151515;
        }


        input::placeholder {

            color:
                #444;
        }


        button {

            width: 100%;

            padding:
                17px 20px;

            border:
                1px solid white;

            background:
                white;

            color:
                #000;

            cursor:
                pointer;

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                1.5px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        button:hover {

            transform:
                translateY(-3px);

            background:
                #ddd;
        }


        /* ================================================
           FOOTER
        ================================================ */

        .footer {

            margin-top:
                35px;

            padding-top:
                18px;

            border-top:
                1px solid #222;

            color:
                #444;

            font-size:
                8px;

            font-weight:
                800;

            letter-spacing:
                1.5px;
        }


        @media (max-width: 500px) {

            body {
                padding:
                    25px;
            }

            .back {

                top: 22px;
                left: 22px;
            }

            .login-wrapper {

                margin-top:
                    35px;
            }

            h1 {

                letter-spacing:
                    -3px;
            }

        }
    </style>

</head>


<body>


    <a href="{{ url_for('articles') }}" class="back">
        ← BACK TO ARTICLES
    </a>


    <main class="login-wrapper">


        <div class="eyebrow">
            RESTRICTED ACCESS
        </div>


        <h1>
            CHAIR<br>
            LOGIN.
        </h1>


        <p class="description">
            Authorized chair access provides moderation
            controls for the press archive.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="{{ url_for('chair_login') }}">

            <label for="password">
                CHAIR PASSWORD
            </label>


            <input type="password" id="password" name="password" placeholder="Enter chair password"
                autocomplete="current-password" required>


            <button type="submit">
                ENTER CHAIR MODE →
            </button>

        </form>


        <div class="footer">
            RESTRICTED ACCESS
        </div>


    </main>


</body>

</html>
